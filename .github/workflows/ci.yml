name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Type-Check & Concurrency Race Detection
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: secure_payment_gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: false

      - name: Cache Go Modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Setup Node.js for Vue 3 Frontend
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Type-Check & Build Vue 3 + TypeScript + Pinia Dashboard
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Install Go Dependencies
        run: go mod download

      - name: Apply Database Migrations
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -d secure_payment_gateway -f migrations/000001_init_schema.up.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d secure_payment_gateway -f migrations/000002_reconciliation_schema.up.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d secure_payment_gateway -f migrations/000003_oms_schema.up.sql

      - name: Build All Go Packages
        run: go build -v ./...

      - name: Run Critical Integration Tests with Race Detector (-race)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: secure_payment_gateway
          DB_SSLMODE: disable
          REDIS_ADDR: localhost:6379
          AES_SECRET_KEY: "01234567890123456789012345678901"
          HMAC_SECRET_KEY: "spg-secret-hmac-key-for-signatures"
          WEBHOOK_SECRET: "spg-webhook-secret-hmac-2026"
        run: go test -v -race ./...

      - name: Validate Production Compose & Multi-Stage Docker Image Build
        run: |
          docker compose -f docker-compose.prod.yml config --quiet
          docker build -t spg-oms:ci .
